[package]
name = "gauntlet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The gauntlet binary: CLI parsing and command dispatch (M6)."

# Claim the eventual `gauntlet` binary name now. The Haskell build still emits
# `gauntlet-exe`, so the two coexist without clobbering during the migration.
[[bin]]
name = "gauntlet"
path = "src/main.rs"

[dependencies]
gauntlet-core.workspace = true
gauntlet-stats.workspace = true
gauntlet-engine.workspace = true
gauntlet-report.workspace = true
gauntlet-tracing.workspace = true
gauntlet-tui.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
